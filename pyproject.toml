[project]
name = "pad-guard"
version = "0.1.0"
description = "Contrôle qualité automatisé de fichiers Prêt à Diffuser (ProRes 422 HQ / DNxHR HQX)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.6",
    "pymupdf>=1.28.2",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "starlette>=1.9.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
pad-guard = "pad_guard.cli:app"
pad-checker = "pad_guard.cli:app"  # former name, kept as an alias

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "playwright>=1.64.1",
    "pytest>=8.0",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pad_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fixtures: needs the generated video fixtures (tests/fixtures/make_fixtures.sh)"]
