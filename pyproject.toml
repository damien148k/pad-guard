[project]
name = "pad-checker"
version = "0.1.0"
description = "Contrôle qualité automatisé de fichiers Prêt à Diffuser (ProRes 422 HQ / DNxHR HQX)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
pad-checker = "pad_checker.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pad_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fixtures: needs the generated video fixtures (tests/fixtures/make_fixtures.sh)"]
