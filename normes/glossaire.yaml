# Glossaire des cahiers des charges des diffuseurs, lu par pad-guard draft-profile (SPEC §13).
#
# Ce fichier n'est pas une norme : il n'apporte aucune valeur au profil et ne touche jamais au verdict.
# Pour chaque champ du profil : termes français (fr) et anglais (en) qui le désignent dans un document,
# unités acceptées pour la valeur citée, contextes à ne pas confondre, plage vraisemblable et forme.
# - Les termes présents dans un lot de pages choisissent les champs dont le glossaire est montré au modèle,
#   et une citation qui contient un terme du champ a le vocabulaire du champ. Un terme doit donc être
#   précis (« noir de tête », pas « noir »).
# - Plage, unités et forme servent au contrôle de vraisemblance : hors plage, unité incompatible ou
#   timecode mal formé -> INVRAISEMBLABLE (valeur gardée, signalée en rouge à la relecture). Les plages
#   ne sont pas des valeurs de norme : elles attrapent les erreurs de lecture (48 pour 48 kHz).
# - normes : alias par lesquels un document renvoie à une norme ; la clé est le nom du fichier normes/<clé>.yaml
#   quand il existe. Une norme sans fichier est signalée « absente de normes/ » dans le brouillon.
# review-profile ajoute ici, après confirmation, le terme employé par un diffuseur quand le relecteur corrige
# ou complète une valeur. Le fichier est réécrit par l'outil : garder les commentaires dans cet en-tête.

