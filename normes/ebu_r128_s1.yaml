sources:
  audio.loudness.long_program_min_seconds: 'EBU R 128 s1 (V3, 2020) p. 4 : « Short-form content: A programme of short duration (up to approximately 2 minutes) »'
  audio.loudness.short.integrated_lufs: 'EBU R 128 s1 (V3, 2020) p. 3 : « the Programme Loudness Level shall be normalised to a Target Level of −23.0 LUFS »'
  audio.loudness.short.integrated_tolerance_lu: 'EBU R 128 s1 (V3, 2020) p. 3 : « a tolerance of ±0.2 LU is allowed in order to take account of measurement errors »'
  audio.loudness.short.short_term_max_lufs: 'EBU R 128 s1 (V3, 2020) p. 3 : « that the Short-term Loudness Level (measured in compliance with EBU Tech 3341 [2]) shall not exceed −18.0 LUFS (+5.0 LU on the relative scale) »'
