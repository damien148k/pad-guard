    citation: "of 203 cd/m2 on a PQ display or on an HLG display that has a nominal peak luminance capability of 1 000 cd/m2"
    remarque: "Niveau de référence (203 cd/m², 58 % PQ, 75 % HLG, tableau 1 p. 8) : pas de champ HDR dans le profil (phase 7)."
  - sujet: "Repères de forme d'onde"
    page: 8
    citation: "A 75%-HLG or 58%-PQ marker on a waveform monitor, representing the reference level"
    remarque: "Pratique d'exploitation, pas un seuil de conformité."
  - sujet: "Plage pleine PQ"
    page: 11
    citation: "the full range signal representation of PQ should be used only when all parties agree"
    remarque: "Même règle que BT.2100 (plage légale par défaut) ; la valeur vient de BT.2100."

