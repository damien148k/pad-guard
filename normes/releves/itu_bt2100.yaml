# Relevé de UIT-R BT.2100-3 (02/2025), fait à la main dans le PDF, vérifié par pad-guard releve-norme.
# Citée par Arte (HDR, p. 12-17). Ne s'applique que sur renvoi (HDR). La plage pleine du tableau 9 sert aussi au
# décodage (decode/video.py) : définition, pas un seuil.

