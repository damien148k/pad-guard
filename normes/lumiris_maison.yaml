# Règles maison de Lumiris Production : décisions internes, pas des normes internationales.
#
# Elles s'appliquent après les normes et avant le profil du diffuseur (dernière entrée de
# meta.extends). Ce sont les règles marquées « source: Lumiris » dans les profils v2, plus les
# paramètres de détection du balayage (v3), plus les méthodes de mesure qu'aucun document de
# diffuseur ne fixe (25/10/2026) : elles s'appliquent quand le profil ne les écrit pas.

meta:
  kind: norm
  name: lumiris_maison
  document:
    title: "Règles internes Lumiris Production pour le pré-contrôle des PAD"
    version: "2026-10-25"
  notes: >
    Le contrôle PSE n'est exigé par aucun diffuseur dans les profils actuels : c'est un contrôle
    interne, à confirmer avec un analyseur Harding certifié.

format:
  unknown_color_tags_severity: minor     # A VERIFIER Vincent

video:
  bit_depth: 10                          # A VERIFIER Vincent : profondeur de calcul des mesures
  prefilter_taps: 3                      # A VERIFIER Vincent
  scan_detection:
    comb_ratio_min: 0.9
    motion_min: 1.0
    interlaced_min_pct: 50.0
    progressive_max_pct: 10.0
    min_moving_frames: 25
  range_detection:
    reserved_min_frames_pct: 1.0         # A VERIFIER avec Vincent

audio:
  silence_dbfs: -60.0                    # A VERIFIER Vincent
  silence_max_seconds: 3.0               # A VERIFIER Vincent
  phase_min_correlation: -0.3            # A VERIFIER : RT 040 p. 11 ne chiffre pas
  phase_min_seconds: 2.0                 # A VERIFIER : idem
  exclude_head_tail: true                # A VERIFIER Vincent

structure:
  timecode:
    tolerance_frames: 0                  # A VERIFIER Vincent
  black:
    y_max: 68                            # A VERIFIER Vincent
    silence_dbfs: -60.0                  # A VERIFIER Vincent
  freeze:
    threshold: 0.5                       # A VERIFIER Vincent
    min_seconds: 2.0                     # A VERIFIER Vincent
  pse:
    enabled: true
    max_flashes_per_second: 3
    flash_min_delta_pct: 10.0
    flash_min_area_pct: 25.0

rules:
  # Regroupement des images en événements, en secondes (converties à la cadence du fichier).
  merge_gap_seconds: 0.5                 # A VERIFIER avec Vincent : 12 images à 25 i/s, comme avant la Phase 6
  audio_merge_gap_seconds: 3.0           # A VERIFIER avec Vincent : true peak, short term, double mono
  min_event_seconds:
    freeze: 2.0                          # A VERIFIER avec Vincent : 50 images à 25 i/s, comme avant la Phase 6
  params:
    # Durée à partir de laquelle un dépassement de niveaux ou de gamut devient majeur (choix de
    # regroupement Lumiris : le document du client ne fixe que la surface).
    levels_major_min_seconds: 1.0        # A VERIFIER avec Vincent : 25 images à 25 i/s, comme avant la Phase 6
  severity:
    pse:
      - {else: major, source: "Lumiris : contrôle interne (SPEC §6.6)"}   # à vérifier avec un analyseur Harding certifié
    integrity:
      - {else: blocking, source: "Lumiris : fichier corrompu ou incomplet"}
    delivery_conversion_required:
      - {else: info, source: "Lumiris : information de livraison, pas une non-conformité du master (CLAUDE.md, Format de livraison)"}
    range_content_mismatch:                # contenu en plage pleine dans un fichier annoncé en plage légale
      - {else: major, source: "Lumiris : bornes de la plage numérique atteintes, contenu en plage pleine probable (décision de Damien, 24/10/2026) ; A VERIFIER"}
    range_tag_suspect:                     # balise plage pleine, contenu en plage légale
      - {else: info, source: "Lumiris : balise de plage probablement fausse, information"}
    audio_not_analysed:                    # MXF OP-Atom : l'audio est dans d'autres fichiers
      - {else: info, source: "Lumiris : audio d'un MXF OP-Atom non analysé, vidéo seule (décision de Damien, 24/10/2026)"}
    alpha_channel:                         # plan alpha (ProRes 4444, DNxHR 444) : ignoré par les mesures
      - {else: info, source: "Lumiris : canal alpha ignoré par les mesures, signalé (décision de Damien, 24/10/2026)"}
    scan_flag_mismatch:                    # images progressives, drapeau entrelacé : l'étiquette est fausse, pas les images
      - {else: major, source: "Lumiris : drapeau de balayage à corriger à l'export (master progressif)"}

sources:
  format.unknown_color_tags_severity: >-
    Lumiris : gravité d'une balise de colorimétrie absente ou « unknown » quand le profil ne la fixe pas
    (aucun document de diffuseur ne la fixe). décision Lumiris, A VERIFIER Vincent.
  video.bit_depth: >-
    Lumiris : les niveaux sont mesurés en valeurs de code 10 bits (CLAUDE.md, conventions ; 8 bits converti,
    12 bits avec les seuils x 4) : méthode de mesure, pas une exigence de diffuseur. décision Lumiris, A VERIFIER Vincent.
  video.prefilter_taps: >-
    Lumiris : filtre horizontal à 3 coefficients avant la mesure des niveaux, quand une norme demande un
    préfiltre sans en fixer la longueur (EBU R 103 le demande). décision Lumiris, A VERIFIER Vincent.
  audio.silence_dbfs: >-
    Lumiris : seuil de détection d'un silence dans le programme, -60 dBFS, quand le document du client ne le
    fixe pas. décision Lumiris, A VERIFIER Vincent.
  audio.silence_max_seconds: >-
    Lumiris : un silence est signalé au-delà de 3 s, quand le document du client ne fixe pas de durée. décision Lumiris, A VERIFIER Vincent.
  audio.phase_min_correlation: >-
    RT 040 p. 11 : « la phase doit être très majoritairement positive » ; seuil chiffré Lumiris (corrélation
    -0,3), A VERIFIER.
  audio.phase_min_seconds: >-
    RT 040 p. 11 : « la phase doit être très majoritairement positive » ; seuil chiffré Lumiris (opposition
    de phase signalée au-delà de 2 s), A VERIFIER.
  audio.exclude_head_tail: >-
    Lumiris : en mode amorce classique, la mire, son signal de 1 kHz et les noirs de tête et de queue sont
    exclus des mesures audio du programme (sans effet en mode sans amorce). décision Lumiris, A VERIFIER Vincent.
  structure.timecode.tolerance_frames: >-
    Lumiris : le début du programme doit tomber sur l'image exacte du timecode attendu (tolérance 0 image).
    décision Lumiris, A VERIFIER Vincent.
  structure.black.y_max: >-
    Lumiris : une image est noire si sa luminance ne dépasse pas 68 en 10 bits (noir légal 64 + 4), pour la
    détection des noirs de tête et de queue. décision Lumiris, A VERIFIER Vincent.
  structure.black.silence_dbfs: >-
    Lumiris : le son est silencieux sous -60 dBFS pour la détection des noirs et silences de tête et de queue.
    décision Lumiris, A VERIFIER Vincent.
  structure.freeze: >-
    Lumiris : une image est figée si sa différence moyenne avec la précédente est sous 0,5 (10 bits), signalée
    à partir de 2 s. décision Lumiris, A VERIFIER Vincent.
  rules.merge_gap_seconds: >-
    Lumiris : deux plages en anomalie séparées de moins de 0,5 s font un seul événement (SPEC §7.1).
    A VERIFIER : à confirmer avec Vincent (décision de Damien, 24/10/2026 : durées en secondes).
  rules.audio_merge_gap_seconds: >-
    Lumiris : les dépassements audio ponctuels (true peak, excursion short term, double mono non identique)
    séparés de moins de 3 s font un seul événement, avec le nombre de dépassements et la valeur la plus
    forte ; 3 s est la fenêtre du loudness short term (EBU Tech 3341 §2.2). Le verdict ne change pas.
    A VERIFIER : à confirmer avec Vincent (décision de Damien, 25/10/2026).
  rules.min_event_seconds: >-
    Lumiris : une image figée n'est signalée qu'à partir de 2 s. A VERIFIER : à confirmer avec Vincent.
  rules.params.levels_major_min_seconds: >-
    Lumiris : choix de regroupement, un dépassement de niveaux ou de gamut d'au moins 1 s est majeur, plus
    court il est mineur. Ce n'est pas une exigence des diffuseurs (Arte §3.2.3.3 ne fixe que la surface).
    A VERIFIER : à confirmer avec Vincent (décision de Damien, 24/10/2026).
  video.range_detection: >-
    Lumiris : un fichier annoncé en plage légale dont au moins 1 % des images du programme ont une luminance
    à 4 ou moins, ou à 1019 ou plus (bornes des données vidéo, UIT-R BT.709-6 partie 2 §4.7, « Video data
    4 through 1 019 » ; « Timing reference 0-3 and 1 020-1 023 » ; ProRes et DNxHR écrêtent à 4-1019) a un
    contenu en plage pleine probable. Sur le vrai master Arte : 0,08 % des images (carton de fin à 1019).
    A VERIFIER : seuil à confirmer avec Vincent sur de vrais fichiers.
  video.scan_detection: >-
    Lumiris : paramètres de la détection de peignage (SPEC §12.5), calibrés le 23/10/2026 sur
    testsrc2 entrelacé par FFmpeg tinterlace (comb ≥ 0,99 sur toutes les images), testsrc2 progressif
    (comb ≤ 0,72) et un master Arte réel 1080 signalé « tb » à contenu progressif (comb 0,60 à 0,78).
    A VERIFIER sur d'autres masters entrelacés réels.
  structure.pse: >-
    Lumiris : contrôle interne PSE (SPEC §6.6, inspiré d'ITU-R BT.1702 et des lignes directrices
    Ofcom) ; non exigé par Arte (profil v2 : « contrôle interne Lumiris »).
