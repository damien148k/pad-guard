<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
</helmet>
<svg width="{{ w }}" height="{{ h }}" viewBox="0 0 110 82" style="display:block;overflow:visible"><rect x="{{ inset }}" y="{{ inset }}" width="{{ rw }}" height="{{ rh }}" fill="{{ rectFill }}" stroke="{{ rectStroke }}" stroke-width="{{ stroke }}"></rect><text x="15" y="63.5" textLength="62" lengthAdjust="spacingAndGlyphs" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="64" fill="{{ textFill }}">PG</text><rect x="83" y="{{ sq1 }}" width="{{ sq }}" height="{{ sq }}" fill="{{ accent }}"></rect><rect x="83" y="{{ sq2 }}" width="{{ sq }}" height="{{ sq }}" fill="{{ accent }}"></rect></svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;240px&quot;,&quot;height&quot;:&quot;180px&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:110,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:12,&quot;max&quot;:600},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;outline&quot;,&quot;options&quot;:[&quot;outline&quot;,&quot;solid&quot;,&quot;bare&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e4e7ea&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;paper&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#12161b&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;oklch(0.72 0.17 150)&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const w = this.props.width ?? 110, v = this.props.variant ?? 'outline', small = w < 40;
    const ink = this.props.ink ?? '#e4e7ea', paper = this.props.paper ?? '#12161b';
    const stroke = v === 'bare' ? 0 : (small ? 6 : 2), sq = small ? 11 : 9;
    return {
      w, h: +(w * 82 / 110).toFixed(2), stroke, inset: stroke / 2, rw: 110 - stroke, rh: 82 - stroke,
      rectFill: v === 'solid' ? ink : 'none', rectStroke: v === 'outline' ? ink : 'none',
      textFill: v === 'solid' ? paper : ink, accent: this.props.accent ?? 'oklch(0.72 0.17 150)',
      sq, sq1: small ? 24 : 26, sq2: small ? 46 : 47,
    };
  }
}
</script>
</body>
</html>
