# Profil de contrôle PAD — ARTE G.E.I.E., HD SDR (1080p25 / 1080p50)
#
# Historique
#   1.0  23/10/2026  validé par Vincent. Version initiale, construite sur les consignes V2-01-00 ;
#                    format.delivery relu dans la V2-01-03.
#   1.2  24/10/2026  validé par Damien (Phase 6, durées en secondes).
#                    - Le 50p était déjà accepté (§3.2.2.1) ; PAD Guard le mesure désormais.
#                    - Les règles white_clip / black_crush / gamut ne comptent plus des images
#                      (« duration_frames >= 25 », soit 0,5 s en 50p) mais des secondes : la durée
#                      minimale d'un dépassement majeur, rules.params.levels_major_min_seconds (1 s),
#                      est un choix de regroupement Lumiris de normes/lumiris_maison.yaml, pas une
#                      exigence d'Arte : le §3.2.3.3 ne fixe que la surface (1 %). Le seuil de
#                      surface reste cité d'Arte.
#                    - Codecs acceptés : la liste du §3.2.2.2 (« Formats pour les éléments de
#                      productions »), chacun cité, au lieu des codecs du master Lumiris (le client
#                      fait foi, décision de Damien du 24/10/2026). La mention « DNX HR/HQ … 10bit »
#                      du §3.2.2.2 est contradictoire (DNxHR HQ est un codec 8 bits) : gardée telle
#                      que citée, A VERIFIER (question à poser à Arte). Le débit (184 Mbps, 112 Mbps)
#                      n'est pas contrôlé.
#                    - pix_fmt remplacé par bit_depth_allowed et chroma_allowed (§3.1, même citation).
#                    - merge_gap et la durée minimale des images figées viennent de
#                      normes/lumiris_maison.yaml, en secondes (0,5 s et 2 s : les mêmes 12 et 50
#                      images qu'avant en 25 i/s).
#   1.1  24/10/2026  validé par Damien.
#                    - Balayage : la règle se fonde sur le balayage détecté sur les images, plus sur
#                      le drapeau seul. Images progressives sous un drapeau entrelacé :
#                      scan_flag_mismatch (major, règle Lumiris de normes/lumiris_maison.yaml).
#                      Images vraiment entrelacées : scan_interlaced, minor (§3.2.2.1, période de
#                      transition : 1080i50 accepté jusqu'au 31/12/2027). Aucune règle ne lit la date
#                      du jour : une version ultérieure de ce profil passera scan_interlaced en blocking.
#                    - Référence des consignes alignée sur le PDF réellement utilisé (V2-01-03,
#                      SHA-256 dans meta.source_pdf_sha256). Aucune valeur changée : d'après le suivi
#                      des versions (p. 8), la V2-01-03 ne modifie par rapport à la V2-01-00 que les
#                      chapitres 2.1, 6.1, 10.1.1 et l'annexe 13 ; chaque paragraphe cité ici a été
#                      retrouvé dans la V2-01-03 sous le même numéro, et le texte du §6.1 cité
#                      (logo) y figure toujours.
#
# Source : "Consignes Techniques Globales ARTE G.E.I.E." V2-01-03 (septembre 2026), version
# majeure V2 applicable au 1er janvier 2026 (les anciennes consignes V1-07-3 restent acceptées
# jusqu'au 31 décembre 2027, §2.1 et §3.2.2.1).
# Ce fichier ne garde que ce qui est propre à Arte ou qui diffère des normes héritées
# (meta.extends) ; `pad-guard explain-profile profiles/arte_hd_sdr.yaml` montre le profil
# effectif, l'origine de chaque valeur et les conflits avec les normes.
# Chaque valeur cite le paragraphe du document (section `sources` en fin de fichier). Les valeurs
# marquées "DEDUIT" ne sont pas écrites noir sur blanc dans le document et sont une
# interprétation à valider.
#
# Le document du client fait foi (CLAUDE.md, principe 2) : toute valeur que les consignes Arte
# fixent est écrite ici avec sa citation, même quand une norme dit la même chose. Les écarts avec
# les normes sont donnés en information dans le rapport, sans effet sur le verdict.
# Hérité de normes/ebu_r128.yaml : méthode de mesure du loudness (information). Hérité de
# normes/lumiris_maison.yaml : contrôle PSE, gravités « Lumiris », détection du balayage.

meta:
  name: arte_hd_sdr
  version: "1.2"
  broadcaster: "ARTE G.E.I.E."
  source_document: "Consignes Techniques Globales ARTE G.E.I.E. V2-01-03 (septembre 2026)"
  notes: >
    Le PAD final Arte est un MXF OP1a XAVC HD Intra Class 100 (§3.2.2.1), fabriqué par le
    prestataire à partir du master livré par Lumiris. Ce profil contrôle ce master avec les règles
    du PAD (niveaux, structure, timecode, audio) ; les codecs acceptés sont ceux que le §3.2.2.2
    préconise pour les éléments de production.
    Les paragraphes cités sont ceux de la V2-01-03 (septembre 2026), le PDF rangé dans
    diffuseurs/ ; le profil a été construit sur la V2-01-00, dont la V2-01-03 garde la
    numérotation et le texte des paragraphes cités (voir l'historique en tête de fichier).
  extends: [ebu_r128, ebu_r103, lumiris_maison]
  status: validated
  validated_by: Damien
  validated_at: 2026-10-24
  source_pdf: "diffuseurs/Consignes Techniques Globales ARTE G.E.I.E_.pdf"
  source_pdf_sha256: 2939fd0b530040a42e0305f2c80ea3d9f28c451020bfaf6662cd1c06e935abf0

format:
  codecs:                                            # §3.2.2.2, ordre préférentiel d'Arte (HD)
    - {codec_name: h264, profile: "High 4:2:2 Intra", label: "XAVC HD Intra Class 100 CBG"}
    - {codec_name: dnxhd, profile: "DNXHD", label: "DNX HD 185"}
    - {codec_name: prores, profile: "HQ", label: "ProRes HQ"}
    - {codec_name: h264, profile: "High 4:2:2 Intra", label: "AVC-Intra 100"}
    - {codec_name: dnxhd, profile: "DNXHR HQ", label: "DNX HR/HQ"}   # A VERIFIER : « DNX HR/HQ … 10bit », DNxHR HQ est en 8 bits
  containers: [mov, mxf]
  bit_depth_allowed: [10]
  chroma_allowed: ["4:2:2"]
  width: 1920                                        # UHD 3840x2160 hors périmètre (Phase 6)
  height: 1080
  fps_allowed: ["25/1", "50/1"]
  field_order: progressive                           # 1080i50 toléré pendant la transition (§3.2.2.1 : jusqu'au 31/12/2027 sous V1-07-3), voir rules.severity.scan_interlaced
  color_primaries: bt709
  color_transfer: bt709
  color_space: bt709
  color_range: tv
  unknown_color_tags_severity: minor
  letterbox:
    check: true
    formats:
      - {aspect: "1.33", active_lines: 1080, first_line: 21,  last_line: 1123, active_pixels: 1440}   # pillarbox
      - {aspect: "1.66", active_lines: 1080, first_line: 21,  last_line: 1123, active_pixels: 1800}   # pillarbox
      - {aspect: "1.77", active_lines: 1080, first_line: 21,  last_line: 1123, active_pixels: 1920}
      - {aspect: "1.85", active_lines: 1036, first_line: 32,  last_line: 1112, active_pixels: 1920}
      - {aspect: "2.35", active_lines: 816,  first_line: 87,  last_line: 1057, active_pixels: 1920}
    tolerance_lines: 2                               # DEDUIT
    # Note : les numéros de ligne du document sont en numérotation SMPTE 274M (ligne 21 = première ligne active).
    # En indices d'image 0..1079 : 1.85 -> lignes 11..1046 (1036 lignes), 2.35 -> lignes 66..881 (816 lignes). A vérifier sur un vrai master.
  delivery:                                          # format du PAD livré à Arte (le master Lumiris est transcodé par le prestataire)
    scan: progressive
    fps: ["50/1", "25/1"]                            # 25p seulement si tournage en 24p ou 25p
    codec: "Sony XAVC HD Intra Class 100 CBG, MXF OP1a (SMPTE ST 377-1:2019, RDD 32:2017)"

video:
  bit_depth: 10
  y_min_legal: 64
  y_max_legal: 940
  y_tolerance_low_pct: -1.0                          # EBU R 103 v3.0 : -5 % (écart signalé dans le rapport)
  y_tolerance_high_pct: 103.0                        # EBU R 103 v3.0 : 105 % (écart signalé dans le rapport)
  rgb_min_pct: -5.0
  rgb_max_pct: 105.0
  max_out_of_range_area_pct: 1.0
  prefilter: true
  prefilter_taps: 3                                  # A VERIFIER : Arte ne chiffre pas le noyau ; choix pad-checker [1 2 1]/4 en attendant le filtre de R 103 (étape séparée)
  measure_spaces: [ycbcr, rgb]

audio:
  sample_rate: 48000
  bit_depth: 24
  bit_depth_allowed: [24, 16]
  same_bit_depth_all_tracks: true
  channel_layout: stereo_pairs
  max_pairs: 8
  no_silent_tracks: true
  silent_track_dbfs: -60.0                           # DEDUIT : une piste entière sous -60 dBFS est "sans contenu"
  dual_mono_must_be_identical: true
  groups:                                            # mapping par défaut ; l'ordre des paires doit être celui déclaré dans Partner (§3.2.2.1)
                                                     # à adapter par fichier avec analyze --audio-map "VO:1-2,VF:3-4"
    - {name: "VO", tracks: [1, 2], layout: stereo, required: true}
    - {name: "VF", tracks: [3, 4], layout: stereo, required: false}  # présente selon le programme
    - {name: "VI", tracks: [5, 6], layout: stereo, required: false}  # version internationale (musique et effets, sans dialogue), selon le programme
  loudness_exempt_groups: ["VI"]                     # DEDUIT : une VI n'a pas de dialogue, l'excursion short term "dialogue" ne s'y applique pas ; le loudness intégré -23 reste exigé
  loudness:
    long_program_min_seconds: 120
    long:
      integrated_lufs: -23.0
      integrated_tolerance_lu: 1.0                   # le texte Arte précise "pour les diffusions en direct" ; pour un fichier viser -23 exactement
      short_term_dialogue_excursion_lu: 7.0
      lra_max_lu: 20.0
      lra_recommended_range_lu: [5, 15]              # bonne pratique, information seulement
    short:
      integrated_lufs: -23.0
      integrated_tolerance_lu: 0.5
      short_term_max_lufs: -20.0
      short_term_excursion_above_lu: 3.0
  true_peak_max_dbtp: -1.0                           # Arte, et non -3 dBTP comme CST RT-017
  alignment_tone: {hz: 1000, dbfs: -18.0}            # si une mire 1 kHz est fournie à part
  silence_dbfs: -60.0
  silence_max_seconds: 3.0                           # DEDUIT : aucun seuil chiffré dans le document ; §6.11.1 interdit les génériques silencieux sur noir
  phase_min_correlation: -0.3                        # DEDUIT de §3.3.4.2 : "phase très majoritairement positive"
  phase_min_seconds: 2.0
  av_sync_ms: {audio_early_max: 40, audio_late_max: 60}   # non mesurable automatiquement sans référence, information
  exclude_head_tail: false                           # pas d'amorces chez Arte, tout le fichier est programme

structure:
  leaders: none
  timecode:
    file_start: "10:00:00:00"
    program_start: "10:00:00:00"                     # le programme commence à la première image du fichier
    tolerance_frames: 0
    drop_frame_allowed: false
    must_be_continuous: true
  bars:
    required: false                                  # pas d'amorce (§3.2.2.1) ; la mire est interdite dans le fichier
    forbidden: true
    tolerance: 12                                    # paramètre de reconnaissance pad-checker (pas une valeur Arte) : erreur moyenne max par zone de mire, en valeurs de code 10 bits
  black:
    head_max_seconds: 2.0                            # DEDUIT : aucune valeur chiffrée (§3.2.2.1 interdit les amorces) ; tolère une ouverture au noir
    tail_max_seconds: 5.0                            # DEDUIT : idem, tolère un fondu de fin au noir
    y_max: 68
    silence_dbfs: -60.0
  first_frames:
    no_subtitles_first_frames: 10                    # concerne le fichier STL, information
  logo:
    forbidden: true                                  # non détectable automatiquement, information
  credits:
    end_credits_max_seconds: {documentary: 30, fiction: 60, cinema: 120}   # non mesurable automatiquement, information
    silent_black_credits_forbidden: true
  freeze:
    threshold: 0.5
    min_seconds: 2.0
  safe_areas:                                        # information
    title_safe_pct: {horizontal: 5.0, vertical: 5.0}
    subtitle_safe: "cadre rouge, voir annexe 13.1"
    logo_corners_free: true

rules:
  # merge_gap_seconds, min_event_seconds.freeze et params.levels_major_min_seconds : normes/lumiris_maison.yaml
  min_event_frames:
    white_clip: 1
    black_crush: 1
    gamut: 1                                         # §3.2.3.3 : le seuil de surface (1 %) fait déjà le filtrage
  max_major: 0
  score_formula: "100 - 40*blocking - 10*major - 2*minor"
  # Chaque règle cite sa source : un paragraphe des consignes Arte V2, une décision interne Lumiris,
  # ou DEDUIT (aucun texte ne le dit). Une règle DEDUIT ne dépasse jamais minor (validate-profile le vérifie).
  # pse et integrity viennent de normes/lumiris_maison.yaml.
  severity:
    white_clip:
      - {if: "area_pct_max >= 1 and duration_s >= levels_major_min_seconds", then: major, source: "Arte §3.2.3.3 (surface) ; durée : Lumiris (rules.params.levels_major_min_seconds)"}   # erreur dès 1 % de la surface
      - {if: "area_pct_max >= 1", then: minor, source: "DEDUIT"}       # dépassement bref : signalé, toléré
      - {else: info, source: "DEDUIT"}
    black_crush:
      - {if: "area_pct_max >= 1 and duration_s >= levels_major_min_seconds", then: major, source: "Arte §3.2.3.3 (surface) ; durée : Lumiris (rules.params.levels_major_min_seconds)"}
      - {if: "area_pct_max >= 1", then: minor, source: "DEDUIT"}
      - {else: info, source: "DEDUIT"}
    gamut:
      - {if: "area_pct_max >= 1 and duration_s >= levels_major_min_seconds", then: major, source: "Arte §3.2.3.3 (surface) ; durée : Lumiris (rules.params.levels_major_min_seconds)"}
      - {if: "area_pct_max >= 1", then: minor, source: "DEDUIT"}
      - {else: info, source: "DEDUIT"}
    freeze:
      - {else: minor, source: "DEDUIT"}                                # le document ne parle pas d'images figées
    isolated_black_frame:
      - {else: minor, source: "DEDUIT"}                                # le document ne parle pas de noirs isolés
    duplicate_frame:
      - {else: minor, source: "DEDUIT"}
    audio_loudness:
      - {else: blocking, source: "Arte §3.3.2.4"}
    audio_true_peak:
      - {else: blocking, source: "Arte §3.3.2.1"}
    audio_short_term_excursion:
      - {else: minor, source: "DEDUIT (Arte §3.3.2.5 : mesure ponctuelle, dialogue non détecté)"}
    audio_lra:
      - {else: major, source: "Arte §3.3.2.5"}
    audio_silent_track:
      - {else: blocking, source: "Arte §3.2.2.1"}
    audio_dual_mono_mismatch:
      - {else: major, source: "Arte §3.3.4.1"}
    audio_silence:
      - {else: minor, source: "DEDUIT"}                                # aucun seuil chiffré (§6.11.1 vise les génériques)
    audio_phase:
      - {else: minor, source: "DEDUIT (Arte §3.3.4.2 : phase très majoritairement positive)"}
    structure_bars_present:
      - {else: blocking, source: "Arte §3.2.2.1"}                      # mire = amorce, interdite
    structure_black_too_long:
      - {else: minor, source: "DEDUIT"}                                # noir de tête/queue au-delà de head/tail_max_seconds
    structure_timecode:
      - {else: blocking, source: "Arte §3.4.1"}
    letterbox:
      - {else: minor, source: "Arte §3.2.4"}
    format:
      - {else: blocking, source: "Arte §3.2.2.1"}
    scan_interlaced:                                   # images entrelacées (balayage détecté) : 1080i50 toléré pendant la transition
      - {else: minor, source: "Arte V2-01-03 §3.2.2.1 : « Les livraisons en 1080i50 seront encore acceptées jusqu'au 31/12/2027 »"}

llm:                                                 # couche IA locale, désactivée sauf --llm ollama
  backend: ollama
  model: "qwen3-vl:32b-instruct"                     # vision + texte, Q4_K_M ≈ 20 Go, tient sur 24 Go de VRAM
  fallback_model: "qwen3-vl:8b-instruct"             # ≈ 6 Go, plus rapide, si le 32B ne tient pas ou pour un aperçu
  num_ctx: 8192
  temperature: 0.1
  language: fr

# Paragraphes des consignes Arte V2-01-03 (numérotation identique à la V2-01-00 pour ces paragraphes),
# affichés par explain-profile.
sources:
  format.codecs: >-
    Arte V2-01-03 §3.2.2.2 « Formats pour les éléments de productions » : « XAVC HD Intra Class 100 CBG
    (1920 x 1080, 4.2.2, 10-bit) ITU-R BT.709 » ; « DNX HD 185, (1920 x 1080, 4.2.2, 10bit) » ; « ProRes HQ,
    à 184 Mbps (1920 x 1080, 4.2.2, 10-bit) » ; « AVC-Intra 100, à 112 Mbps (1920 x 1080, 4.2.2, 10-bit) ».
    A VERIFIER : « DNX HR/HQ, (3840 x 2160, 4.2.2, 10bit) » (liste UHD) est contradictoire, DNxHR HQ étant
    un codec 8 bits ; repris tel que cité, question à poser à Arte. XAVC Intra et AVC-Intra : ffprobe les
    nomme tous deux h264 « High 4:2:2 Intra » (classe et débit non contrôlés).
  format.containers: "Lumiris : master interne en MOV ou MXF"
  format.bit_depth_allowed: "Arte §3.1 : « 4:2:2 10 bits »"
  format.chroma_allowed: "Arte §3.1 : « 4:2:2 10 bits »"
  format.width: "Arte §3.2.2.1 : 1920 x 1080"
  format.height: "Arte §3.2.2.1 : 1920 x 1080"
  format.fps_allowed: "Arte §3.2.2.1 : 50p, ou 25p si tournage 24p/25p"
  format.field_order: "Arte §3.2.2.1 : progressif"
  format.color_primaries: "Arte §3.2.2.1 : ITU-R BT.709"
  format.color_transfer: "Arte §3.2.2.1 : ITU-R BT.709"
  format.color_space: "Arte §3.2.2.1 : ITU-R BT.709"
  format.color_range: "Arte §3.2.3.2 : 64-940 en 10 bits"
  format.unknown_color_tags_severity: "Lumiris : balise absente = avertissement"
  format.letterbox: "Arte §3.2.4 : lignes actives attendues selon le format d'image (tolerance_lines : DEDUIT)"
  format.delivery.scan: "Arte V2-01-03 §3.2.2.1, « Spécification des profils du fichier version SDR » : « Type de Balayage Progressif »"
  format.delivery.fps: "Arte V2-01-03 §3.2.2.1 : « Fréquence image 50p / sec ; 25p / sec si tournage en 24p ou 25p »"
  format.delivery.codec: "Arte V2-01-03 §3.2.2.1 : « Profil XAVC HD Intra Class 100 CBG pour HD 1080p / 50 ou 25 images par seconde » ; « Format de fichier MXF » (SMPTE ST 377-1:2019, SMPTE RDD 32:2017)"
  video.bit_depth: "Arte §3.1 : 10 bits"
  video.y_tolerance_low_pct: "Arte §3.2.3.3 : « La luminance (Y) doit être entre -1 % et 103 % (-7 mV et 721 mV) »"
  video.y_tolerance_high_pct: "Arte §3.2.3.3 : « La luminance (Y) doit être entre -1 % et 103 % (-7 mV et 721 mV) »"
  video.y_min_legal: "Arte §3.2.3.2 : « entre 64 et 940 (systèmes 10-bit) »"
  video.y_max_legal: "Arte §3.2.3.2 : « entre 64 et 940 (systèmes 10-bit) »"
  video.rgb_min_pct: "Arte §3.2.3.3 : « Les composantes RVB doivent être entre -5 % et 105 % (-35 et 735 mV) »"
  video.rgb_max_pct: "Arte §3.2.3.3 : « Les composantes RVB doivent être entre -5 % et 105 % (-35 et 735 mV) »"
  video.max_out_of_range_area_pct: "Arte §3.2.3.3 : « une erreur ne sera affichée que si le dépassement de Gamut représente au moins 1 % de la superficie de l'image »"
  video.prefilter: "Arte §3.2.3.3 : « Un léger dépassement fugitif est généralement filtré avant la mesure »"
  video.prefilter_taps: "A VERIFIER : Arte §3.2.3.3 ne chiffre pas le noyau ; choix pad-checker"
  video.measure_spaces: "Arte §3.2.3 : mesures dans les deux espaces (RVB et YCrCb)"
  audio.sample_rate: "Arte §3.3 / §3.3.4"
  audio.bit_depth: "Arte §3.3.4 : 24 bits prioritaire (16 bits seulement pour SD up-converti)"
  audio.bit_depth_allowed: "Arte §3.3.4"
  audio.same_bit_depth_all_tracks: "Arte §3.3.4"
  audio.channel_layout: "Arte §3.2.2.1 / §3.3.4 : pistes gérées par paire AES"
  audio.max_pairs: "Arte §3.3 : jusqu'à 8 paires AES"
  audio.no_silent_tracks: "Arte §3.2.2.1 : « pas de piste avec silence »"
  audio.silent_track_dbfs: "DEDUIT"
  audio.dual_mono_must_be_identical: "Arte §3.3.4.1 : mono = 2 pistes strictement identiques et en phase"
  audio.groups: "Arte §3.2.2.1 : ordre des paires déclaré dans Partner (mapping par défaut Lumiris)"
  audio.loudness_exempt_groups: "DEDUIT"
  audio.loudness.long_program_min_seconds: "Arte §3.3.2.4 : programmes > 2'00"
  audio.loudness.long.integrated_lufs: "Arte §3.3.2.4 : « Programmes de durée supérieure à 2’00 » : « -23 LUFS (avec une tolérance de ± 1 LU pour les diffusions en direct) »"
  audio.true_peak_max_dbtp: "Arte §3.3.2.1 : « Ce niveau ne doit pas dépasser -1 dB TP en PCM »"
  audio.loudness.long.integrated_tolerance_lu: "Arte §3.3.2.4 : « -23 LUFS (avec une tolérance de ± 1 LU pour les diffusions en direct) »"
  audio.loudness.long.short_term_dialogue_excursion_lu: "Arte §3.3.2.5 : « ± 7 LU mesuré en Short Term autour de la valeur cible » (dialogue)"
  audio.loudness.long.lra_max_lu: "Arte §3.3.2.5 : « La valeur du LRA doit être inférieure ou égale à 20 LU »"
  audio.loudness.long.lra_recommended_range_lu: "Arte §3.3.2.5 : « comprise entre 5 et 15 LU » (bonne pratique)"
  audio.loudness.short.integrated_lufs: "Arte §3.3.2.4 : « - 23 LUFS (avec une tolérance de ± 0.5 LU) »"
  audio.loudness.short.integrated_tolerance_lu: "Arte §3.3.2.4 : « ± 0.5 LU »"
  audio.loudness.short.short_term_max_lufs: "Arte §3.3.2.4 : « Short Term […] inférieure ou égale à -20 LUFS »"
  audio.loudness.short.short_term_excursion_above_lu: "Arte §3.3.2.5 : + 3 LU max au-dessus de la cible"
  audio.alignment_tone: "Arte §3.3.2.3 : 1000 Hz à -18 dBFS"
  audio.silence_dbfs: "DEDUIT"
  audio.silence_max_seconds: "DEDUIT"
  audio.phase_min_correlation: "DEDUIT de Arte §3.3.4.2"
  audio.phase_min_seconds: "DEDUIT"
